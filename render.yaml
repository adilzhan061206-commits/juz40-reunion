# Free plan: no persistent disk, so the SQLite database resets to demo data whenever the
# service restarts or redeploys. For permanent data switch to a paid plan with a disk, or set
# DATABASE_URL to a PostgreSQL database.
services:
  - type: web
    name: keste-sdu-registration
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
